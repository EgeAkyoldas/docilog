# ═══════════════════════════════════════════════════════════════════
# 1. BOTERMA BRAND BIBLE — AI'ın bilmesi gereken her şey
# ═══════════════════════════════════════════════════════════════════

brand:
  name: "Boterma"
  tagline: "Evini senin gibi aydınlat"
  founded: 2019
  hq: "İstanbul, Türkiye"
  type: "Akıllı ev aydınlatma ve iç mekan dekorasyon markası"
  price_range: "Mid-premium (₺1,200 – ₺18,000)"
  distribution: "Online (boterma.com.tr), flagship store Nişantaşı, seçili ev dekorasyon mağazaları"
  social:
    instagram: "@boterma"
    tiktok: "@boterma_ev"
    pinterest: "boterma"

  brand_promise: |
    Boterma, akıllı aydınlatmayı sadece teknoloji ürünü olarak değil,
    yaşam tarzı objesi olarak konumlandırır. Her ürün hem işlevsel hem de
    estetik açıdan ev dekorasyonunun ayrılmaz bir parçası haline gelecek
    şekilde tasarlanmıştır.

  brand_personality:
    - Samimi ama sofistike
    - Tasarım odaklı, teknobabble yok
    - Gerçek evler için gerçek çözümler
    - "Güzel olan, kullanışlı olanla buluşur"

  target_audience:
    primary: "25-38 yaş, kentsel, yüksek eğitimli, gelir üstü orta sınıf"
    interests: "İç mekan tasarımı, Pinterest, slow living, sürdürülebilirlik, evden çalışma"
    pain_points:
      - "Ev lambaları ya çok ucuz görünüyor ya da çok pahalı"
      - "Nasıl dekor yaparım ama abartmam bilmiyorum"
      - "Sürdürülebilir ama stil sahibi ürün bulmak zor"
      - "Evden çalışırken ışık kalitesi gözlerimi yoruyor"
    aspirations:
      - "Evim hem estetik hem rahat olsun"
      - "Her detay düşünülmüş bir alan yaratmak"
      - "Az ama öz — sadece gerçekten sevdiğim şeyler"

